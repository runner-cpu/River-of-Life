<!doctype html><html><head><meta charset="utf-8"><title>Verified model inspection</title>
<style>body{margin:0;background:#e9e7df;font:16px system-ui}main{display:grid;grid-template-columns:repeat(4,1fr)}article{height:290px;border:1px solid #ccc}canvas{width:100%;height:250px;display:block}p{margin:8px 12px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body><main></main>
<script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const manifest=await fetch('/models/manifest.json').then(r=>r.json());window.results=[];
// Reuse one context; copied frames remain visible without exceeding browser GPU context limits.
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(390,250);r.setPixelRatio(1);r.setClearColor('#e9e7df');
for(const asset of manifest){const name=asset.speciesId,a=document.createElement('article'),canvas=document.createElement('canvas'),label=document.createElement('p');canvas.width=390;canvas.height=250;label.textContent=name+' · '+asset.license;a.append(canvas,label);document.querySelector('main').append(a);const s=new T.Scene(),c=new T.PerspectiveCamera(35,390/250,.01,100);s.add(new T.HemisphereLight(0xffffff,0x666055,3));const l=new T.DirectionalLight(0xffffff,4);l.position.set(3,4,2);s.add(l);
try{const g=await new GLTFLoader().loadAsync(asset.url);const wrapper=new T.Group();wrapper.add(g.scene);const idle=g.animations.find(a=>/idle/i.test(a.name));const mixer=new T.AnimationMixer(wrapper);if(idle){mixer.clipAction(idle).play();mixer.update(.6)}g.scene.updateMatrixWorld(true);g.scene.traverse(o=>{if(o.isSkinnedMesh)o.skeleton.update()});const box=new T.Box3().setFromObject(g.scene,true),v=box.getSize(new T.Vector3()),ctr=box.getCenter(new T.Vector3()),m=Math.max(v.x,v.y,v.z);wrapper.scale.setScalar(2/m);wrapper.position.copy(ctr).multiplyScalar(-2/m);s.add(wrapper);c.position.set(3,1.9,3.4);c.lookAt(0,0,0);if(name==='archaeopteryx'){c.position.set(0,0,3.8);c.lookAt(0,0,0)}r.render(s,c);canvas.getContext('2d').drawImage(r.domElement,0,0);window.results.push({name,animations:g.animations.map(a=>a.name),bounds:v.toArray(),renderedTriangles:r.info.render.triangles});mixer.stopAllAction();mixer.uncacheRoot(wrapper);g.scene.traverse(o=>{if(o.geometry)o.geometry.dispose();for(const material of(o.material?Array.isArray(o.material)?o.material:[o.material]:[])){for(const val of Object.values(material))if(val?.isTexture)val.dispose();material.dispose()}})}catch(e){label.textContent+=' ERROR '+e;window.results.push({name,error:String(e)})}}
r.dispose();r.forceContextLoss();window.ready=true;
</script></body></html>
